<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--navy:#12295C;--blue:#1668CF;--bluet:#0F4FA8;--green:#1E7A3C;--amber:#B36B00;--red:#B3261E;
--surface:#FFFFFF;--bg:#F4F6FA;--text:#1A1A1A;--muted:#5A6472;--line:#E4E8F0;
--r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-synthesis:none;letter-spacing:.005em}
input,select,textarea,button{-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;margin:0}
input,select,textarea{font:inherit;color:inherit;outline:none}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.press{transition:transform .06s ease, filter .06s ease}
.press:active{transform:scale(.97);filter:brightness(.96)}
.scr{scrollbar-width:none;-ms-overflow-style:none}
.scr::-webkit-scrollbar{width:0;height:0}
a{color:var(--bluet);text-decoration:none}
a:hover{color:var(--navy)}
@keyframes gfmUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes gfmFade{from{opacity:0}to{opacity:1}}
@keyframes gfmPop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</helmet>
<div id="gfmroot">{{ app }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:940},&quot;afficherCadre&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aperçu&quot;},&quot;demarrerVerrouille&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aperçu&quot;},&quot;donneesDemo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Données&quot;}}">
const h = React.createElement, F = React.Fragment;
const KEY = "gfm_db_v3";
const TABLES = ["vehicule","prestation","agent","encaissement","mouvement_dette_personnel","journal_audit","parametre"];
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MOISL = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

class Component extends DCLogic {
  state = this.build();

  /* ---------- init / persistence ---------- */
  build(){
    const pr = this.props || {};
    let db = this.load();
    if(!db){ db = this.seed(pr.donneesDemo ?? true); this.persist(db); }
    return {
      db, rev:0,
      locked: pr.demarrerVerrouille ?? true,
      codeBuf:"",
      view:"accueil", stack:[], params:{},
      sf:null, saved:null,
      keypad:null, confirm:null, undo:null, toast:null, datePick:null, agentsInactifs:false,
      idleWarn:false, idleLeft:300,
      accPeriode:"jour", accFrom:"", accTo:"",
      auditPeriode:"jour", auditFrom:"", auditTo:"",
      periode:"jour", customFrom:"", customTo:"",
      histoPeriode:"tout", histoFrom:"", histoTo:"",
      rapportKind:null, restoreStep:null, restoreData:null, restoreWord:""
    };
  }
  load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
  persist(db){ try{ localStorage.setItem(KEY, JSON.stringify(db||this.state.db)); }catch(e){} }
  commit(){ this.persist(); this.setState(s=>({rev:s.rev+1})); }
  componentDidMount(){
    this._lastActivity=Date.now();
    this._bump=()=>{ if(!this.state.locked && !this.state.idleWarn) this._lastActivity=Date.now(); };
    ["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,this._bump,{passive:true}));
    this._idleTick=setInterval(()=>{
      if(this.state.locked) return;
      if(!this.state.idleWarn){
        if(Date.now()-this._lastActivity>=600000){ this._warnStart=Date.now(); this.setState({idleWarn:true,idleLeft:300}); }
      }else{
        const left=Math.max(0,300-Math.floor((Date.now()-this._warnStart)/1000));
        if(left<=0){ this.setState({idleWarn:false,locked:true,codeBuf:"",view:"accueil",stack:[]}); }
        else if(left!==this.state.idleLeft){ this.setState({idleLeft:left}); }
      }
    },1000);
  }
  componentWillUnmount(){ clearInterval(this._idleTick); ["pointerdown","keydown","touchstart"].forEach(ev=>document.removeEventListener(ev,this._bump)); }
  resetIdle(){ this._lastActivity=Date.now(); if(this.state.idleWarn) this.setState({idleWarn:false}); }
  nextId(t){ const db=this.state.db; db.seq=db.seq||{}; db.seq[t]=(db.seq[t]||0)+1; return db.seq[t]; }
  audit(table,id,action,before){
    const db=this.state.db;
    const entry={id:this.nextId("journal_audit"),table_cible:table,enregistrement_id:id,action,valeur_avant:before?JSON.stringify(before):null,valeur_apres:null,horodatage:this.nowIso()};
    db.journal_audit.push(entry);
    setTimeout(()=>{ try{ const rec=(db[table]||[]).find(r=>r.id===id); if(rec){ entry.valeur_apres=JSON.stringify({...rec}); this.persist(); } }catch(e){} },0);
  }

  seed(demo){
    const db={vehicule:[],prestation:[],agent:[],encaissement:[],mouvement_dette_personnel:[],journal_audit:[],parametre:[],seq:{}};
    const now=this.nowIso();
    const P=(libelle,montant,part,icone,ordre)=>db.prestation.push({id:this.seqOn(db,"prestation"),libelle,montant,part_laveur_defaut:part,icone,ordre,actif:1});
    P("Lavage simple",2000,700,"simple",1);
    P("Lavage complet",3500,1200,"complet",2);
    P("Lavage moto",1000,400,"moto",3);
    P("Nettoyage intérieur",2500,900,"interieur",4);
    P("Lustrage carrosserie",5000,1800,"lustrage",5);
    const params={version_schema:"1",heure_cloture_caisse:"22",code_verrouillage_hash:this.djb2("0000"),derniere_sauvegarde:"",version_application:"1.0.0"};
    Object.keys(params).forEach(k=>db.parametre.push({cle:k,valeur:params[k]}));
    if(!demo) return db;
    const A=(nom,prenom,fonction,dette,salaire)=>db.agent.push({id:this.seqOn(db,"agent"),nom,prenom,telephone:"",fonction,dette_ouverture:dette||0,salaire_brut:salaire||0,actif:1,motif_inactif:"",date_inactif:""});
    A("Mabiala","Jean","Laveur",0,90000);A("Nkodia","Paul","Laveur",0,90000);A("Loemba","André","Laveur",5000,90000);A("Samba","Éric","Gardien",0,80000);
    const laveurs=[1,2,3];
    const V=(immat,ch,tel,d,a)=>db.vehicule.push({id:this.seqOn(db,"vehicule"),immatriculation:immat,chauffeur:ch,telephone:tel||"",dette_ouverture:d||0,avance_ouverture:a||0,derniere_utilisation:now,actif:1,cree_le:now});
    V("AB-123-CG","Serge Ondongo","06 111 22 33",5000,0);
    V("CD-456-CG","Marlène Kaya","05 444 55 66",0,3000);
    V("EF-789-CG","Blaise Moukala","",0,0);
    V("GH-012-CG","Prince Tati","",0,0);
    V("IJ-345-CG","Aline Bemba","06 777 88 99",2000,0);
    V("KL-678-CG","Rodrigue Nzaba","",0,0);
    V("MN-901-CG","Divine Loubota","",0,0);
    V("OP-234-CG","Chris Malonga","",0,0);
    // seeded historical encaissements
    let rng=(function(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};})(20260723);
    const bz=new Date(Date.now()+3600000);
    let baseDay=bz.getUTCDate(); if(bz.getUTCHours()>=22) baseDay+=1;
    for(let dOff=13; dOff>=0; dOff--){
      const d=new Date(Date.UTC(bz.getUTCFullYear(),bz.getUTCMonth(),baseDay-dOff));
      const dateOp=this.isoDate(d);
      const n=3+Math.floor(rng()*4);
      for(let k=0;k<n;k++){
        const veh=db.vehicule[Math.floor(rng()*db.vehicule.length)];
        const prest=db.prestation[Math.floor(rng()*db.prestation.length)];
        const rec=prest.montant, part=prest.part_laveur_defaut;
        let dc=0,dp=0,au=0,av=0;
        const roll=rng();
        if(roll<0.14) dc=rec; else if(roll<0.22){ dc=Math.min(rec,500*(1+Math.floor(rng()*3))); }
        if(rng()<0.10) av=1000*(2+Math.floor(rng()*4));
        const hh=String(8+Math.floor(rng()*12)).padStart(2,"0"), mm=String(Math.floor(rng()*60)).padStart(2,"0");
        const nette=rec-part-dc+dp-au+av;
        db.encaissement.push({id:this.seqOn(db,"encaissement"),date_operation:dateOp,horodatage_saisie:dateOp+"T"+hh+":"+mm+":00+01:00",vehicule_id:veh.id,prestation_id:prest.id,recette_lavage:rec,laveur_agent_id:laveurs[Math.floor(rng()*laveurs.length)],part_laveur:part,dette_contractee:dc,dette_payee:dp,avance_utilisee:au,avance_versee:av,recette_nette:nette,note:"",supprime:0,modifie_le:null});
      }
    }
    const M=(agent_id,type,montant,motif,dOff)=>{const d=new Date(Date.UTC(bz.getUTCFullYear(),bz.getUTCMonth(),bz.getUTCDate()-dOff));db.mouvement_dette_personnel.push({id:this.seqOn(db,"mouvement_dette_personnel"),agent_id,date_operation:this.isoDate(d),type,montant,motif,supprime:0,horodatage_saisie:now});};
    M(1,"DETTE",3000,"Avance sur salaire",8);M(2,"DETTE",2000,"Avance sur salaire",6);M(2,"REMBOURSEMENT",1000,"Retenue paie",2);
    return db;
  }
  seqOn(db,t){ db.seq=db.seq||{}; db.seq[t]=(db.seq[t]||0)+1; return db.seq[t]; }

  /* ---------- helpers ---------- */
  djb2(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return "h"+h.toString(16); }
  param(k){ const p=this.state.db.parametre.find(x=>x.cle===k); return p?p.valeur:null; }
  setParam(k,v){ const p=this.state.db.parametre.find(x=>x.cle===k); if(p)p.valeur=v; else this.state.db.parametre.push({cle:k,valeur:v}); }
  fmt(n){ const neg=n<0; const s=Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0"); return (neg?"\u2212":"")+s+"\u00A0FCFA"; }
  fmtN(n){ const neg=n<0; const s=Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0"); return (neg?"\u2212":"")+s; }
  norm(s){ return (s||"").toUpperCase().replace(/[\s-]/g,""); }
  isoDate(d){ return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
  nowIso(){ return new Date(Date.now()+3600000).toISOString().replace(/\.\d+Z$/,"+01:00"); }
  bzNow(){ return new Date(Date.now()+3600000); }
  journeeToday(){
    const b=this.bzNow(); const cl=parseInt(this.param("heure_cloture_caisse")||"22",10);
    let y=b.getUTCFullYear(),m=b.getUTCMonth(),day=b.getUTCDate();
    if(b.getUTCHours()>=cl){ const n=new Date(Date.UTC(y,m,day+1)); return this.isoDate(n); }
    return this.isoDate(new Date(Date.UTC(y,m,day)));
  }
  frDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return parseInt(d,10)+" "+MOIS[parseInt(m,10)-1]+" "+y; }
  frDateLong(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return parseInt(d,10)+" "+MOISL[parseInt(m,10)-1]+" "+y; }
  heure(hor){ if(!hor) return ""; const t=hor.split("T")[1]||""; return t.slice(0,5); }

  encActifs(){ return this.state.db.encaissement.filter(e=>e.supprime===0); }
  calc(s){ return s.recetteLavage - s.partLaveur - s.detteContractee + s.dettePayee - s.avanceUtilisee + s.avanceVersee; }
  soldeDette(vid){ const v=this.state.db.vehicule.find(x=>x.id===vid); if(!v) return 0; let s=v.dette_ouverture; this.encActifs().forEach(e=>{ if(e.vehicule_id===vid) s+=e.dette_contractee-e.dette_payee; }); return s; }
  soldeAvance(vid){ const v=this.state.db.vehicule.find(x=>x.id===vid); if(!v) return 0; let s=v.avance_ouverture; this.encActifs().forEach(e=>{ if(e.vehicule_id===vid) s+=e.avance_versee-e.avance_utilisee; }); return s; }
  detteAgent(aid){ const a=this.state.db.agent.find(x=>x.id===aid); if(!a) return 0; let s=a.dette_ouverture; this.state.db.mouvement_dette_personnel.filter(m=>m.supprime===0&&m.agent_id===aid).forEach(m=>{ s+= m.type==="DETTE"?m.montant:-m.montant; }); return s; }
  controle(s,soldeD,soldeA){
    const e=[];
    if(!(s.recetteLavage>0)) e.push("Sélectionnez une prestation.");
    if(!(s.partLaveur>=0 && s.partLaveur<=s.recetteLavage)) e.push("La part du laveur ne peut pas dépasser le montant du lavage.");
    if(s.detteContractee+s.avanceUtilisee>s.recetteLavage) e.push("Le total de la dette et de l'avance dépasse le montant du lavage.");
    if(s.avanceUtilisee>soldeA) e.push("Ce véhicule ne dispose que de "+this.fmt(soldeA)+" d'avance.");
    if(s.dettePayee>soldeD) e.push("Ce véhicule ne doit que "+this.fmt(soldeD)+".");
    return e;
  }

  /* ---------- navigation ---------- */
  nav(view,params){ this.setState(s=>({stack:[...s.stack,{view:s.view,params:s.params}],view,params:params||{}})); }
  back(){ this.setState(s=>{ const st=[...s.stack]; const prev=st.pop(); return prev?{view:prev.view,params:prev.params,stack:st}:{view:"accueil",stack:[]}; }); }
  tab(view){ this.setState({view,params:{},stack:[]}); }
  toast(msg){ this.setState({toast:msg}); clearTimeout(this._tt); this._tt=setTimeout(()=>this.setState({toast:null}),2600); }
  openConfirm(cfg){ this.setState({confirm:cfg}); }
  openKeypad(cfg){ this.setState({keypad:{...cfg,buf:String(cfg.value||"")}}); }

  /* ---------- saisie ---------- */
  newSF(){ return {editId:null,vehicule_id:null,vehSearch:"",prestation_id:null,partLaveur:0,laveur_agent_id:null,detteContractee:0,dettePayee:0,avanceUtilisee:0,avanceVersee:0,avanceOverride:false,dateOp:this.journeeToday(),note:"",open:false}; }
  openSaisie(editId){
    let sf=this.newSF();
    if(editId){
      const e=this.state.db.encaissement.find(x=>x.id===editId);
      const v=this.state.db.vehicule.find(x=>x.id===e.vehicule_id);
      sf={editId,vehicule_id:e.vehicule_id,vehSearch:v?v.immatriculation:"",prestation_id:e.prestation_id,partLaveur:e.part_laveur,laveur_agent_id:e.laveur_agent_id,detteContractee:e.dette_contractee,dettePayee:e.dette_payee,avanceUtilisee:e.avance_utilisee,avanceVersee:e.avance_versee,avanceOverride:true,dateOp:e.date_operation,note:e.note||"",open:(e.dette_contractee||e.dette_payee||e.avance_utilisee||e.avance_versee)>0};
    }
    this.setState({sf,saved:null},()=>this.nav("saisie"));
  }
  setSF(patch){ this.setState(s=>({sf:{...s.sf,...patch}})); }
  selectVeh(v){
    const sf=this.state.sf; const prest=this.state.db.prestation.find(p=>p.id===sf.prestation_id);
    const soldeA=this.soldeAvance(v.id); const rec=prest?prest.montant:0;
    let au=sf.avanceUtilisee, open=sf.open;
    if(!sf.avanceOverride && soldeA>0 && rec>0){ au=Math.min(soldeA,rec); open=true; }
    this.setSF({vehicule_id:v.id,vehSearch:v.immatriculation,avanceUtilisee:au,open:open||soldeA>0});
  }
  selectPrest(p){
    const sf=this.state.sf; const soldeA=sf.vehicule_id?this.soldeAvance(sf.vehicule_id):0;
    let au=sf.avanceUtilisee;
    if(!sf.avanceOverride && soldeA>0){ au=Math.min(soldeA,p.montant); }
    this.setSF({prestation_id:p.id,partLaveur:p.part_laveur_defaut,avanceUtilisee:au,laveur_agent_id:sf.laveur_agent_id||(this.state.db.agent.filter(a=>a.actif&&a.fonction==="Laveur")[0]||{}).id||null});
  }
  vehResults(){
    const q=this.norm(this.state.sf.vehSearch);
    let list=this.state.db.vehicule.filter(v=>v.actif===1);
    list.sort((a,b)=>String(b.derniere_utilisation||"").localeCompare(String(a.derniere_utilisation||"")));
    if(q) list=list.filter(v=>this.norm(v.immatriculation).includes(q)||this.norm(v.chauffeur).includes(q));
    return list.slice(0,6);
  }
  saveSaisie(){
    const sf=this.state.sf; const db=this.state.db;
    const prest=db.prestation.find(p=>p.id===sf.prestation_id);
    const rec=prest.montant;
    const s={recetteLavage:rec,partLaveur:sf.partLaveur,detteContractee:sf.detteContractee,dettePayee:sf.dettePayee,avanceUtilisee:sf.avanceUtilisee,avanceVersee:sf.avanceVersee};
    const nette=this.calc(s);
    const veh=db.vehicule.find(v=>v.id===sf.vehicule_id);
    if(sf.editId){
      const e=db.encaissement.find(x=>x.id===sf.editId);
      this.audit("encaissement",e.id,"MODIFICATION",{...e});
      Object.assign(e,{date_operation:sf.dateOp,vehicule_id:sf.vehicule_id,prestation_id:sf.prestation_id,recette_lavage:rec,laveur_agent_id:sf.laveur_agent_id,part_laveur:sf.partLaveur,dette_contractee:sf.detteContractee,dette_payee:sf.dettePayee,avance_utilisee:sf.avanceUtilisee,avance_versee:sf.avanceVersee,recette_nette:nette,note:sf.note,modifie_le:this.nowIso()});
    }else{
      const id=this.nextId("encaissement");
      db.encaissement.push({id,date_operation:sf.dateOp,horodatage_saisie:this.nowIso(),vehicule_id:sf.vehicule_id,prestation_id:sf.prestation_id,recette_lavage:rec,laveur_agent_id:sf.laveur_agent_id,part_laveur:sf.partLaveur,dette_contractee:sf.detteContractee,dette_payee:sf.dettePayee,avance_utilisee:sf.avanceUtilisee,avance_versee:sf.avanceVersee,recette_nette:nette,note:sf.note,supprime:0,modifie_le:null});
      this.audit("encaissement",id,"CREATION",null);
    }
    if(veh) veh.derniere_utilisation=this.nowIso();
    if(navigator.vibrate) try{navigator.vibrate(20);}catch(e){}
    this.persist();
    this.setState(s2=>({rev:s2.rev+1,saved:{nette,immat:veh?veh.immatriculation:"",edit:!!sf.editId}}));
  }
  deleteEnc(id){
    const db=this.state.db; const e=db.encaissement.find(x=>x.id===id);
    this.audit("encaissement",id,"SUPPRESSION",{...e});
    e.supprime=1; e.modifie_le=this.nowIso();
    this.persist();
    clearTimeout(this._undo);
    this.setState(s=>({rev:s.rev+1,undo:{msg:"Encaissement supprimé",id}}));
    this._undo=setTimeout(()=>this.setState({undo:null}),8000);
  }
  undoDelete(){ const u=this.state.undo; if(!u) return; const e=this.state.db.encaissement.find(x=>x.id===u.id); if(e){ e.supprime=0; this.persist(); } clearTimeout(this._undo); this.setState(s=>({rev:s.rev+1,undo:null})); }

  /* ---------- CRUD refs ---------- */
  saveVeh(f){
    const db=this.state.db;
    if(f.id){ const v=db.vehicule.find(x=>x.id===f.id); this.audit("vehicule",f.id,"MODIFICATION",{...v}); Object.assign(v,{immatriculation:f.immatriculation,chauffeur:f.chauffeur,telephone:f.telephone,dette_ouverture:f.dette_ouverture,avance_ouverture:f.avance_ouverture}); }
    else{ const id=this.nextId("vehicule"); db.vehicule.push({id,immatriculation:f.immatriculation,chauffeur:f.chauffeur,telephone:f.telephone,dette_ouverture:f.dette_ouverture,avance_ouverture:f.avance_ouverture,derniere_utilisation:this.nowIso(),actif:1,cree_le:this.nowIso()}); this.audit("vehicule",id,"CREATION",null); }
    this.commit(); this.back();
  }
  savePrest(f){
    const db=this.state.db;
    if(f.id){ const p=db.prestation.find(x=>x.id===f.id); this.audit("prestation",f.id,"MODIFICATION",{...p}); Object.assign(p,{libelle:f.libelle,montant:f.montant,part_laveur_defaut:f.part_laveur_defaut,ordre:f.ordre}); }
    else{ const id=this.nextId("prestation"); db.prestation.push({id,libelle:f.libelle,montant:f.montant,part_laveur_defaut:f.part_laveur_defaut,icone:"simple",ordre:f.ordre,actif:1}); this.audit("prestation",id,"CREATION",null); }
    this.commit(); this.back();
  }
  saveAgent(f){

  /* ---------- backup / restore ---------- */
  async sha256(str){
    try{ if(crypto&&crypto.subtle){ const b=new TextEncoder().encode(str); const d=await crypto.subtle.digest("SHA-256",b); return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,"0")).join(""); } }catch(e){}
    // repli déterministe (contexte non sécurisé) : double FNV-1a
    let h1=0x811c9dc5,h2=0x01000193; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2^c,2246822519)>>>0; }
    return (h1>>>0).toString(16).padStart(8,"0")+(h2>>>0).toString(16).padStart(8,"0");
  }
  serialDet(donnees){
    const sortKeys=o=>{ const r={}; Object.keys(o).sort().forEach(k=>r[k]=o[k]); return r; };
    const out={}; TABLES.forEach(t=>{ out[t]=(donnees[t]||[]).slice().sort((a,b)=>(a.id||0)-(b.id||0)).map(sortKeys); });
    return JSON.stringify(out);
  }
  async doBackup(){
    const db=this.state.db; const donnees={}; TABLES.forEach(t=>donnees[t]=db[t]);
    const ser=this.serialDet(donnees); const emp=await this.sha256(ser);
    const dates=this.encActifs().map(e=>e.date_operation).sort();
    const file={format:"GFM_SAUVEGARDE",version_format:1,version_schema:1,version_application:this.param("version_application")||"1.0.0",
      genere_le:this.nowIso(),fuseau:"Africa/Brazzaville",appareil_origine:"Chef de site",empreinte:emp,
      totaux_controle:{nb_vehicule:db.vehicule.length,nb_prestation:db.prestation.length,nb_agent:db.agent.length,nb_encaissement:db.encaissement.length,nb_mouvement_dette_personnel:db.mouvement_dette_personnel.length,nb_journal_audit:db.journal_audit.length,somme_recette_nette:this.encActifs().reduce((a,e)=>a+e.recette_nette,0),somme_recette_lavage:this.encActifs().reduce((a,e)=>a+e.recette_lavage,0),date_premiere_operation:dates[0]||"",date_derniere_operation:dates[dates.length-1]||""},
      donnees};
    const b=this.bzNow(); const stamp=this.isoDate(b)+"_"+String(b.getUTCHours()).padStart(2,"0")+String(b.getUTCMinutes()).padStart(2,"0");
    this.dl("GFM_Sauvegarde_"+stamp+".gfmbak",new Blob([JSON.stringify(file,null,2)],{type:"application/json"}));
    this.setParam("derniere_sauvegarde",this.nowIso()); this.commit();
    this.toast("Sauvegarde générée ("+db.encaissement.length+" écritures)");
  }
  async pickRestore(file){
    try{
      const txt=await file.text(); const data=JSON.parse(txt);
      if(data.format!=="GFM_SAUVEGARDE"){ this.toast("Fichier non reconnu"); return; }
      if((data.version_format||1)>1){ this.toast("Version de fichier trop récente — mettez à jour l'application"); return; }
      const emp=await this.sha256(this.serialDet(data.donnees));
      if(emp!==data.empreinte){ this.openConfirm({title:"Intégrité en défaut",message:"L'empreinte du fichier ne correspond pas. La restauration est refusée pour protéger vos données.",okLabel:"Fermer",onOk:()=>this.setState({confirm:null})}); return; }
      this.setState({restoreData:data,restoreStep:1,restoreWord:""});
    }catch(e){ this.toast("Lecture impossible : "+e.message); }

  execRestore(){

    db.seq=db.seq||{}; TABLES.forEach(t=>{ let mx=0; db[t].forEach(r=>{ if(r.id>mx)mx=r.id; }); db.seq[t]=mx; });
    this.persist();

    const t=data.totaux_controle;
    this.openConfirm({title:"Restauration réussie",message:t.nb_encaissement+" encaissements restaurés, du "+this.frDateLong(t.date_premiere_operation)+" au "+this.frDateLong(t.date_derniere_operation)+". Toutes les vérifications sont conformes.",okLabel:"Parfait",onOk:()=>this.setState({confirm:null,view:"accueil",stack:[]})});
